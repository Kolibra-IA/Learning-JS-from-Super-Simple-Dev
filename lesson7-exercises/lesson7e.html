<!--
Question:

Create a function "ConvertTocelsius(fahrenheit)" that takes a number in degree fahrenheit and returns a number in degree celsius.

- Formula: Celsius = (fahrenheit-32)*5/9.
- ConvertToCelsius(86) => 30.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 7 : Exercise e</title>
  </head>
  <body>
    <script>
      function convertToCelsius(fahrenheit) {
        return (fahrenheit - 32) * (5 / 9);
      }

      console.log(convertToCelsius(86));
    </script>
  </body>
</html>

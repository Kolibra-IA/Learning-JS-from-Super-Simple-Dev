<!-- Question: In exercises 5i-5k, we created the 'Remove from cart', '-2', and
'-3' buttons. Before updating the cart quantity, check if it will go to zero: -
If it will go to zero, create a popup saying "No enough items in the cart" and
don't update the quantity. -Otherwise, update the quantity and console.log() it
as usual. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 6l</title>
  </head>
  <body>
    <h1>Cart Quantity</h1>
    <button onclick="console.log(`Cart Quantity : ${cartQuantity}`)">
      Show Quantity
    </button>
    <button onclick="updateCartQuantity(1)">Add to Cart</button>
    <button onclick="updateCartQuantity(2)">+2</button>
    <button onclick="updateCartQuantity(3)">+3</button>
    <button onclick="updateCartQuantity(4)">+4</button>
    <button onclick="updateCartQuantity(5)">+5</button>
    <button
      onclick="
        if (cartQuantity - 2 < 0) {
          alert('Not enough items in the cart');
        } else {
          updateCartQuantity(-2);
        }
      "
    >
      -2
    </button>
    <button
      onclick="
        if (cartQuantity - 3 < 0) {
          alert('Not enough items in the cart');
        } else {
          updateCartQuantity(-3);
        }
      "
    >
      -3
    </button>
    <button
      onclick="
        if (cartQuantity - 1 < 0) {
          alert('Not enough items in the cart');
        } else {
          updateCartQuantity(-1);
        }
      "
    >
      Remove from cart
    </button>
    <button
      onclick="
        cartQuantity = 0;
        showCartQuantity();
      "
    >
      Reset Cart
    </button>
    <script>
      let cartQuantity = 0;

      function showCartQuantity() {
        console.log(`Cart Quantity : ${cartQuantity}`);
      }

      function updateCartQuantity(amount) {
        if (amount <= 0) {
          alert("Amount is not valid");
          return;
        } else {
          cartQuantity += amount;
          showCartQuantity();
        }
      }
    </script>
  </body>
</html>

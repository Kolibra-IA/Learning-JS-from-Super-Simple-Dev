<!--
Question:

Create a function "ConvertToFahrenheit(celsius)" that takes a number in degree celsius and returns a number in degree Fahrenheit.

- Formula: Fahrenheit = (Celsius*9/5) + 32.
- ConvertToFahrenheit(25) => 77.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 7 : Exercise d</title>
  </head>
  <body>
    <script>
      function convertToFahrenheit(celsius) {
        return celsius * (9 / 5) + 32;
      }

      console.log(convertToFahrenheit(25));
    </script>
  </body>
</html>

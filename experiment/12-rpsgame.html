<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Scissor-Paper Game</title>
    <style>
      .img-user {
        height: 50px;
        border: 2px solid black;
        border-radius: 50%;
        background-color: black;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <h1 style="font-family: Arial, Helvetica, sans-serif">
      Rock-Scissor-Paper Game
    </h1>
    <h3>User's Pick:</h3>
    <img src="../images/rock-emoji.png" alt="" class="img-user rock-pick" />
    <img
      src="../images/scissors-emoji.png"
      alt=""
      class="img-user scissors-pick"
    />
    <img src="../images/paper-emoji.png" alt="" class="img-user paper-pick" />

    <h3>Computer's Move:</h3>
    <p class="computer-move"></p>

    <h3>Pick Comparison:</h3>
    <p class="comparison"></p>

    <h3>Round Result:</h3>
    <p class="result"></p>

    <h3>Total Result:</h3>
    <p>
      Win: <span id="win-count">0</span> Loss:
      <span id="loss-count">0</span> Tie: <span id="tie-count">0</span>
    </p>

    <button class="reset-button">Reset</button>
    <button class="auto-play-button">Auto-play</button>
    <script src="12-rpsgame.js"></script>
  </body>
</html>

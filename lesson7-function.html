<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function</title>
  </head>
  <body>
    <script>
      function function1() {
        console.log("Hello");
        console.log(2 + 2);

        function1();
        function1();
      }

      function function2(user) {
        console.log("Hello " + user);
      }

      function function3(user, age) {
        console.log("Hello " + user + ", you are " + age + " years old.");
        return user;
      }
    </script>
  </body>
</html>

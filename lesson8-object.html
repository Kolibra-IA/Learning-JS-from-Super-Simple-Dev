<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects</title>
  </head>
  <body>
    <script>
      const product = {
        name: "socks",
        price: 1000,
      };

      console.log(product);
      console.log(product.name);
      console.log(product.price);

      product.name = "cutton socks";
      console.log(product.name);

      product.newProperty = true;
      delete product.newProperty;

      const product2 = {
        name: "shirt",
        ["delivery-time"]: "1-day",
        rating: {
          star: 4.5,
          count: 86,
        },
        fun: function () {
          console.log("Function inside object");
        },
      };

      console.log(product2.name);
      console.log(product2["delivery-time"]);
      console.log(product2.rating.star);
      console.log(product2.fun());

      /* Built-in Objects

      - Console (console.log).
      - Math (Math.random()). 
      - JSON (JSON.stringify()).
      - JSON (JSON.parse()).
      */

      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString));
    </script>
  </body>
</html>

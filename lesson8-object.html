<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects</title>
  </head>
  <body>
    <script>
      const product = {
        name: "socks",
        price: 1000,
      };

      console.log(product);
      console.log(product.name);
      console.log(product.price);

      product.name = "cutton socks";
      console.log(product.name);

      product.newProperty = true;
      delete product.newProperty;
    </script>
  </body>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects</title>
  </head>
  <body>
    <script>
      const product = {
        name: "socks",
        price: 1000,
      };

      console.log(product);
      console.log(product.name);
      console.log(product.price);

      product.name = "cutton socks";
      console.log(product.name);

      product.newProperty = true;
      delete product.newProperty;

      const product2 = {
        name: "shirt",
        ["delivery-time"]: "1-day",
        rating: {
          star: 4.5,
          count: 86,
        },
        fun: function () {
          console.log("Function inside object");
        },
      };

      console.log(product2.name);
      console.log(product2["delivery-time"]);
      console.log(product2.rating.star);
      console.log(product2.fun());

      /* Built-in Objects

      - Console (console.log).
      - Math (Math.random()).
      - JSON (JSON.stringify()).
      - JSON (JSON.parse()).
      */

      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString));

      //Objects are copied by reference: I mean if you assign an object to a variabe, what you are assignng is the reference to that object, not the object itself. For example:

      const ayub = {
        message: "good job!",
      };

      /* {message : 'good job!'} is not stored in ayub variable; instead, it is stored somewhere in memory and ony its reference is stored there.

      If you attempt to copy the object to another variable A via its variable name, Ayub, you will only copy the reference - not the object.

      In fact, you can make changes to that same object via the two variables A and ayub since they hold the same reference: */

      const A = ayub;

      ayub.message = "Great job!";

      console.log(ayub.message);
      console.log(A.message);

      //The two above will spit out the same result since they hold the same reference to the object in memory!

      /*

      Destructing is a shortcut to assign object's properties' values to variables

      */

      const object4 = {
        message: "Good job!",
        price: 1000,
      };

      const { message, price } = object4;

      console.log(message);
      console.log(price);

      const object5 = {
        message,
        method() {
          console.log("method");
        },
      };

      console.log(object5);
    </script>
  </body>
</html>

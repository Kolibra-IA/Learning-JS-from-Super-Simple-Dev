<!-- 
Question: Let's say the cart has a maximum quantity of 10. Before updating the quantity, check if the quantity will be greater than 10:

- If it will, display a popup saying 'The cart is full' and don't update the quantity.
- Otherwise, update the quantity and console.log it as usual.
-->

<!doctype html>
<html lang="en">
  <head>
    <title>Cart Project</title>
  </head>

  <body>
    <h1>Cart Quantity</h1>
    <button onclick="console.log(`Cart Quantity : ${cartQuantity}`)">
      Show Quantity
    </button>
    <button
      onclick="
        if (cartQuantity + 1 > 10) {
          alert('The cart is full');
        } else {
          cartQuantity++;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      Add to Cart
    </button>
    <button
      onclick="
        if (cartQuantity + 2 > 10) {
          alert('The cart is full');
        } else {
          cartQuantity += 2;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      +2
    </button>
    <button
      onclick="
        if (cartQuantity + 3 > 10) {
          alert('The cart is full');
        } else {
          cartQuantity += 3;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      +3
    </button>
    <button
      onclick="
        if (cartQuantity + 4 > 10) {
          alert('The cart is full');
        } else {
          cartQuantity += 4;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      +4
    </button>
    <button
      onclick="
        if (cartQuantity + 5 > 10) {
          alert('The cart is full');
        } else {
          cartQuantity += 5;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      +5
    </button>
    <button
      onclick="
        cartQuantity -= 2;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      -2
    </button>
    <button
      onclick="
        cartQuantity -= 3;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      -3
    </button>
    <button
      onclick="
        cartQuantity = cartQuantity - 1;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      Remove from cart
    </button>
    <button
      onclick="
        cartQuantity = 0;
        console.log(`Cart quantity is reset.`);
        console.log(`Cart Quantity: ${cartQuantity}`);
      "
    >
      Reset Cart
    </button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>

  <body>
    <script>
      /*
        Question:
        Instead of using if-statements in the previous exercises, try switching them into ternary operators (consition?A:B).
        */
      const randomNumber = Math.random();
      let result;
      const guess = "Heads";
      result = randomNumber < 0.5 ? "Heads" : "Tails";

      guess === result ? console.log("You win!") : console.log("You lose!");
    </script>
  </body>

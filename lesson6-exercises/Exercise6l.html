<!-- Question: In exercises 5i-5k, we created the 'Remove from cart', '-2', and
'-3' buttons. Before updating the cart quantity, check if it will go to zero: -
If it will go to zero, create a popup saying "No enough items in the cart" and
don't update the quantity. -Otherwise, update the quantity and console.log() it
as usual. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 6l</title>
  </head>
  <body>
    <h1>Cart Quantity</h1>
    <button onclick="console.log(`Cart Quantity : ${cartQuantity}`)">
      Show Quantity
    </button>
    <button
      onclick="
        cartQuantity++;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      Add to Cart
    </button>
    <button
      onclick="
        cartQuantity += 2;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      +2
    </button>
    <button
      onclick="
        cartQuantity += 3;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      +3
    </button>
    <button
      onclick="
        cartQuantity += 4;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      +4
    </button>
    <button
      onclick="
        cartQuantity += 5;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      +5
    </button>
    <button
      onclick="
        if (cartQuantity - 2 < 0) {
          alert('Not enough items in the cart');
        } else {
          cartQuantity -= 2;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      -2
    </button>
    <button
      onclick="
        if (cartQuantity - 3 < 0) {
          alert('Not enough items in the cart');
        } else {
          cartQuantity -= 3;
          console.log(`Cart Quantity : ${cartQuantity}`);
        }
      "
    >
      -3
    </button>
    <button
      onclick="
        cartQuantity = cartQuantity - 1;
        console.log(`Cart Quantity : ${cartQuantity}`);
      "
    >
      Remove from cart
    </button>
    <button
      onclick="
        cartQuantity = 0;
        console.log(`Cart quantity is reset.`);
        console.log(`Cart Quantity: ${cartQuantity}`);
      "
    >
      Reset Cart
    </button>
    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>

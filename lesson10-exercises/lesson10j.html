<!--
Question: Create the rest of the buttons in the calculator. To create multiple rows of buttons, put the buttons inside <p> elements like this:
-->

<!doctype html>
<html lang="en">
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="lesson10j.css" />
  </head>
  <body>
    <p class="input-output"></p>
    <p>
      <button onclick="updateCalculation('1')">1</button>
      <button onclick="updateCalculation('2')">2</button
      ><button onclick="updateCalculation('3')">3</button>
      <button onclick="updateCalculation(' + ')" class="symbol-button">
        +
      </button>
    </p>
    <p>
      <button onclick="updateCalculation('4')">4</button
      ><button onclick="updateCalculation('5')">5</button>
      <button onclick="updateCalculation('6')">6</button>
      <button onclick="updateCalculation(' - ')" class="symbol-button">
        -
      </button>
    </p>

    <p>
      <button onclick="updateCalculation('7')">7</button>
      <button onclick="updateCalculation('8')">8</button
      ><button onclick="updateCalculation('9')">9</button>
      <button onclick="updateCalculation(' * ')" class="symbol-button">
        *
      </button>
    </p>
    <p></p>
    <p>
      <button onclick="updateCalculation('0')">0</button>
      <button onclick="updateCalculation('.')">.</button>
      <button
        onclick="
          calculation = eval(calculation);
          console.log(calculation);
          displayCalculation();
        "
      >
        =
      </button>
      <button onclick="updateCalculation('/')" class="symbol-button">/</button>
    </p>
    <p>
      <button
        onclick="
          document.querySelector('p').innerText = ``;
          localStorage.removeItem('calculation');
        "
        class="clear-button"
      >
        Clear
      </button>
    </p>

    <script src="lesson10j.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title>Lesson 6: Project</title>
    <link rel="stylesheet" href="styles/experiment.css" />
  </head>
  <body>
    <!--
    Rules:
    - Rock beats scissors.
    - Paper beats rock.
    - Scissors beats paper.
    -->

    <h1 class="title">Rock Paper Scissors</h1>
    <button onclick="playGame('rock')" class="move-button rock">
      <img src="images/rock-emoji.png" class="move-icon" alt="" />
    </button>
    <button onclick="playGame('paper')" class="move-button paper">
      <img src="images/paper-emoji.png" class="move-icon" alt="" />
    </button>
    <button onclick="playGame('scissors')" class="move-button scissors">
      <img src="images/scissors-emoji.png" class="move-icon" alt="" />
    </button>
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>
    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
        document.querySelector('.js-moves').innerHTML = '';
        document.querySelector('.js-result').innerText = '';
      "
      class="reset-score-button reset"
    >
      Reset Score
    </button>

    <button class="reset-score-button auto-play">Auto-play</button>

    <script src="scripts/experiment.js"></script>
  </body>
</html>
